<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>動詞三態互動學習網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        display: ['"Fredoka"', 'cursive'],
                    },
                    colors: {
                        'brand-blue': '#4facfe',
                        'brand-purple': '#00f2fe',
                        'game-bg': '#f3f4f6',
                    },
                    animation: {
                        'glow-pulse': 'glowPulse 1.5s infinite',
                    },
                    keyframes: {
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(250, 204, 21, 0.7)' },
                            '50%': { boxShadow: '0 0 0 10px rgba(250, 204, 21, 0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            -webkit-overflow-scrolling: touch;
        }

        .btn-3d {
            transition: all 0.1s;
            transform: translateY(0);
            border-bottom-width: 4px;
            touch-action: manipulation; 
        }
        .btn-3d:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-top: 2px;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: rgba(255, 154, 158, 0.4); animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: rgba(161, 140, 209, 0.4); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 40%; width: 300px; height: 300px; background: rgba(251, 194, 235, 0.3); animation-delay: -2s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 100%;
        }

        .table-scroll {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
        }

        .verb-table {
            width: max-content;
            min-width: 680px;
        }

        @media (min-width: 768px) {
            .verb-table {
                width: 100%;
                min-width: 100%;
            }
        }

        @media (max-width: 640px) {
            .app-shell {
                max-width: none;
                padding-left: 0;
                padding-right: 0;
            }

            .app-shell > header,
            .app-shell > .tab-wrap {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }

            #study-view,
            #verb-tables {
                width: 100vw;
                width: 100dvw;
                max-width: 100vw;
                max-width: 100dvw;
                margin-left: 0;
                margin-right: 0;
            }

            #verb-tables > .glass-panel {
                width: 100vw;
                width: 100dvw;
                max-width: 100vw;
                max-width: 100dvw;
                border-left: 0;
                border-right: 0;
                border-radius: 0;
            }
        }

        /* --- 表格樣式優化 --- */
        .table-row-base {
            transition: all 0.2s;
        }
        
        /* 1. 橫向選中 (Selected Row) - 黃色 */
        .selected-row {
            background-color: #fef08a !important; /* amber-200 */
            transform: scale(1.02);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 10;
            position: relative;
            border-radius: 8px;
        }
        .selected-row td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .selected-row td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

        /* 2. 直向選中 (Selected Column) - 藍色 */
        .selected-col {
            background-color: #e0f2fe !important; /* sky-100 */
        }
        
        /* 表頭直向選中 */
        th.selected-col-header {
            background-color: #bae6fd !important; /* sky-200 */
            color: #0369a1; /* sky-700 */
            border-bottom: 2px solid #0ea5e9;
        }
        
        /* 3. 交集處 (Intersection) - 深黃色強調 */
        .selected-row td.selected-col {
            background-color: #fcd34d !important; /* amber-300 */
            font-weight: 800;
            color: #000;
            border: 2px solid #f59e0b; /* amber-500 border */
        }
        
        /* 可點擊提示 */
        th { cursor: pointer; transition: background-color 0.2s; user-select: none; }
        th:hover { background-color: #f0f9ff; }


        .speaker-icon {
            cursor: pointer;
            color: #6366f1;
            transition: all 0.2s;
            padding: 2px; 
        }
        .speaker-icon:active, .speaker-icon:hover {
            color: #4338ca;
            transform: scale(1.2);
        }
        .speaker-icon.active {
            color: #ec4899;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .hidden-section { display: none !important; }

        .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        
        .fade-in-up { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 新增：答錯時的震動動畫 */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
        
        input[type="text"], input[type="number"] {
            -webkit-appearance: none;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="text-slate-700 antialiased selection:bg-purple-200 selection:text-purple-900">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="app-shell mx-auto w-full max-w-6xl px-3 py-6 md:px-4 md:py-8 relative z-10">
        
        <header class="text-center mb-8 fade-in-up">
            <h1 class="text-3xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 tracking-tight font-display drop-shadow-sm mb-3 md:mb-4">
                動詞三態大挑戰
            </h1>
            <p class="text-sm md:text-xl text-slate-600 font-medium bg-white/60 inline-block px-4 py-2 rounded-full shadow-sm backdrop-blur-sm">
                🎧 點擊喇叭聽發音 · 👆 點擊行列做標記 · 🚀 切換分頁闖關
            </p>
        </header>

        <!-- 導航按鈕 -->
        <div class="tab-wrap flex justify-center mb-8 fade-in-up" style="animation-delay: 0.1s;">
            <div class="bg-white/80 p-1.5 md:p-2 rounded-2xl shadow-lg backdrop-blur flex gap-2 w-full max-w-md md:w-auto">
                <button id="tab-study" class="flex-1 md:flex-none px-4 md:px-8 py-3 rounded-xl font-bold text-base md:text-lg transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white shadow-md transform scale-100 md:scale-105">
                    <span>📖</span> <span class="hidden md:inline">單字表</span>學習
                </button>
                <button id="tab-quiz" class="flex-1 md:flex-none px-4 md:px-8 py-3 rounded-xl font-bold text-base md:text-lg transition-all duration-300 flex items-center justify-center gap-2 text-slate-500 hover:bg-slate-100">
                    <span>🎮</span> <span class="hidden md:inline">隨機</span>測驗
                </button>
            </div>
        </div>

        <!-- 學習區塊 -->
        <div id="study-view" class="fade-in-up pb-10" style="animation-delay: 0.2s;">
            <main id="verb-tables" class="w-full max-w-full min-w-0 space-y-8 md:space-y-10">
                <!-- JS Generated -->
            </main>
        </div>

        <!-- 測驗區塊 -->
        <div id="quiz-view" class="hidden-section fade-in-up pb-10">
            <section class="max-w-4xl mx-auto">
                
                <div class="glass-panel rounded-3xl shadow-2xl overflow-hidden min-h-[500px] flex flex-col relative">
                    
                    <div class="h-3 bg-gradient-to-r from-yellow-400 via-red-500 to-pink-500 w-full"></div>

                    <!-- Lobby (準備畫面) -->
                    <div id="quiz-lobby" class="flex-1 flex flex-col items-center justify-center p-6 md:p-8 text-center bounce-in">
                        <div class="text-6xl md:text-8xl mb-4 md:mb-6 animate-bounce">🚀</div>
                        <h2 class="text-2xl md:text-4xl font-black text-slate-800 mb-3 md:mb-4">準備好接受挑戰了嗎？</h2>
                        <p class="text-base md:text-xl text-slate-600 mb-8 max-w-md">選擇下方的範圍，測試你對動詞三態的熟悉程度！</p>
                        
                        <div class="flex flex-col md:flex-row gap-4 mb-8 w-full max-w-4xl justify-center">
                            <!-- 範圍選擇器 -->
                            <div class="bg-white/60 p-5 rounded-2xl border border-white shadow-inner flex-1">
                                <h3 class="text-base md:text-lg font-bold text-slate-700 mb-4 flex items-center justify-center gap-2">
                                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                                    請勾選測驗範圍
                                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                                </h3>
                                <!-- 範圍選擇器容器 -->
                                <div id="category-selector" class="grid grid-cols-1 gap-3 text-left">
                                    <!-- JS Generated Checkboxes -->
                                </div>
                            </div>

                            <!-- 題型選擇器 -->
                            <div class="bg-white/60 p-5 rounded-2xl border border-white shadow-inner flex-1">
                                <h3 class="text-base md:text-lg font-bold text-slate-700 mb-4 flex items-center justify-center gap-2">
                                    <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                                    請勾選測驗題型
                                    <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                                </h3>
                                <div id="form-selector" class="grid grid-cols-1 gap-3 text-left">
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border-2 border-slate-200 cursor-pointer transition-all hover:border-purple-400 has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50 shadow-sm active:scale-95">
                                        <input type="checkbox" value="infinitive" checked class="w-5 h-5 md:w-6 md:h-6 text-purple-600 rounded focus:ring-purple-500 border-gray-300 transition-all">
                                        <span class="text-slate-700 font-bold text-sm md:text-base select-none flex-1">現在式</span>
                                    </label>
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border-2 border-slate-200 cursor-pointer transition-all hover:border-purple-400 has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50 shadow-sm active:scale-95">
                                        <input type="checkbox" value="pastSimple" checked class="w-5 h-5 md:w-6 md:h-6 text-purple-600 rounded focus:ring-purple-500 border-gray-300 transition-all">
                                        <span class="text-slate-700 font-bold text-sm md:text-base select-none flex-1">過去式</span>
                                    </label>
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border-2 border-slate-200 cursor-pointer transition-all hover:border-purple-400 has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50 shadow-sm active:scale-95">
                                        <input type="checkbox" value="pastParticiple" checked class="w-5 h-5 md:w-6 md:h-6 text-purple-600 rounded focus:ring-purple-500 border-gray-300 transition-all">
                                        <span class="text-slate-700 font-bold text-sm md:text-base select-none flex-1">VPP</span>
                                    </label>
                                    <label class="flex items-center gap-3 p-3 bg-white rounded-xl border-2 border-slate-200 cursor-pointer transition-all hover:border-purple-400 has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50 shadow-sm active:scale-95">
                                        <input type="checkbox" value="presentParticiple" checked class="w-5 h-5 md:w-6 md:h-6 text-purple-600 rounded focus:ring-purple-500 border-gray-300 transition-all">
                                        <span class="text-slate-700 font-bold text-sm md:text-base select-none flex-1">V-ing</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <button id="start-game-btn" class="btn-3d w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-black text-xl md:text-2xl rounded-2xl shadow-xl border-blue-600 hover:brightness-110 active:scale-95 flex items-center justify-center gap-3">
                            開始挑戰 GO!
                        </button>
                    </div>

                    <!-- Interface (測驗進行中) -->
                    <div id="quiz-interface" class="hidden-section flex-1 flex flex-col p-4 md:p-10">
                        
                        <!-- HUD -->
                        <div class="flex justify-between items-center mb-6 md:mb-8">
                            <button id="back-to-lobby-btn" class="px-3 py-2 bg-slate-100 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-700 hover:bg-slate-200 flex items-center gap-1 transition-colors">
                                ← 設定
                            </button>
                            <div class="flex gap-2 md:gap-4">
                                <div class="bg-white px-3 py-1.5 md:px-4 md:py-2 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center min-w-[70px] md:min-w-[100px]">
                                    <span class="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider">Score</span>
                                    <span id="score" class="text-xl md:text-2xl font-black text-blue-600 leading-none">0</span>
                                </div>
                                <div class="bg-white px-3 py-1.5 md:px-4 md:py-2 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center min-w-[70px] md:min-w-[100px]">
                                    <span class="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider">Streak</span>
                                    <span id="streak" class="text-xl md:text-2xl font-black text-orange-500 leading-none">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- Question Area -->
                        <div class="flex-1 flex flex-col items-center justify-start md:justify-center max-w-3xl mx-auto w-full">
                            
                            <div class="w-full bg-gradient-to-br from-indigo-600 to-purple-700 text-white rounded-2xl p-6 md:p-12 shadow-xl mb-6 text-center relative overflow-hidden group">
                                <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl md:text-9xl font-display select-none pointer-events-none">?</div>
                                <p id="question-text" class="text-xl md:text-4xl font-bold leading-relaxed relative z-10">
                                    Loading...
                                </p>
                            </div>

                            <div class="w-full space-y-4">
                                <input type="text" id="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="請輸入答案..." class="w-full text-center text-xl md:text-3xl font-bold py-4 px-4 md:py-5 md:px-6 rounded-2xl border-4 border-slate-200 focus:border-purple-400 focus:ring-4 focus:ring-purple-100 outline-none transition-all placeholder:text-slate-300 bg-white shadow-inner text-slate-700">
                                
                                <!-- 按鈕區域 -->
                                <div class="h-20 md:h-24 w-full relative flex gap-3">
                                    <button id="submit-btn" class="btn-3d w-full h-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold text-lg md:text-2xl rounded-2xl shadow-lg border-emerald-600 hover:brightness-110 active:scale-95 transition-all">
                                        送出答案 (Enter)
                                    </button>
                                    
                                    <div id="next-action-container" class="hidden-section w-full h-full flex gap-2 md:gap-3">
                                        <div class="w-1/3 h-full bg-orange-100 rounded-2xl border-4 border-orange-200 flex flex-col items-center justify-center shadow-inner">
                                            <span class="text-[10px] md:text-xs font-bold text-orange-400 uppercase">Streak</span>
                                            <div id="local-streak" class="text-2xl md:text-3xl font-black text-orange-500 flex items-center gap-1">
                                                🔥 x0
                                            </div>
                                        </div>

                                        <button id="next-question-btn" class="btn-3d flex-1 h-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-bold text-lg md:text-2xl rounded-2xl shadow-lg border-yellow-600 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2 animate-glow-pulse">
                                            下一題 <span>➔</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- 更新：移除原本寫死的高度限制，讓大卡片能自動撐開 -->
                            <div id="feedback-container" class="mt-6 w-full transition-all opacity-0">
                                <!-- Feedback -->
                            </div>

                        </div>
                    </div>

                </div>
            </section>
        </div>

    </div>

    <script>

        // 幫音效引擎做初始化 (解決瀏覽器阻擋自動播放的限制)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 播放 Web Audio 產生的音效
        function playSound(type) {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // 答對音效：清脆的上升高音
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1); // G5
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else {
                // 答錯音效：低沉的震動聲
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            selectedVoice = voices.find(voice => voice.name === 'Google US English' && voice.lang === 'en-US');
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => 
                    voice.lang === 'en-US' && 
                    (voice.name.includes('Samantha') || voice.name.includes('Fred') || voice.name.includes('Daniel') || voice.name.includes('Karen'))
                );
            }
            if (!selectedVoice) {
                 selectedVoice = voices.find(voice => voice.lang === 'en-US');
            }
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.startsWith('en'));
            }
        }

        function speak(texts, iconElement = null) {
            if (!('speechSynthesis' in window)) return;
            if (!selectedVoice || speechSynthesis.getVoices().length === 0) loadVoices();

            const wordsToSpeak = Array.isArray(texts) ? texts : [texts];
            if (wordsToSpeak.length === 0) return;

            speechSynthesis.cancel(); 
            document.querySelectorAll('.speaker-icon.active').forEach(icon => {
                icon.classList.remove('active');
            });

            if (iconElement) {
                iconElement.classList.add('active');
            }

            let currentIndex = 0;

            function speakNext() {
                if (currentIndex < wordsToSpeak.length) {
                    const utterance = new SpeechSynthesisUtterance(wordsToSpeak[currentIndex]);
                    utterance.lang = 'en-US';
                    if (selectedVoice) utterance.voice = selectedVoice;
                    utterance.pitch = 1.1; 
                    utterance.rate = 0.9; 

                    utterance.onend = () => {
                        currentIndex++;
                        speakNext();
                    };
                    
                    utterance.onerror = (e) => {
                         if (iconElement) iconElement.classList.remove('active');
                    };

                    speechSynthesis.speak(utterance);
                } else {
                    if (iconElement) {
                        iconElement.classList.remove('active');
                    }
                }
            }
            speakNext();
        }

        // New Helper for Column Highlighting
        function handleColumnClick(table, colIndex) {
            // Find current selected header in this table
            const currentHeader = table.querySelector(`th:nth-child(${colIndex + 1})`);
            const isAlreadySelected = currentHeader.classList.contains('selected-col-header');

            // Clear all column highlights in this table
            table.querySelectorAll('.selected-col').forEach(el => el.classList.remove('selected-col'));
            table.querySelectorAll('.selected-col-header').forEach(el => el.classList.remove('selected-col-header'));

            // Toggle logic: if it wasn't selected, select it now
            if (!isAlreadySelected) {
                // Highlight header
                currentHeader.classList.add('selected-col-header');
                // Highlight all cells in this column
                const rows = table.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    const cell = row.children[colIndex];
                    if (cell) cell.classList.add('selected-col');
                });
            }
        }

                .flatMap(group => group.verbs);

            const randomVerb = quizPool[Math.floor(Math.random() * quizPool.length)];
            const questionType = selectedForms[Math.floor(Math.random() * selectedForms.length)];
            
            let typeText = '';

            if (questionType === 'infinitive') {
                typeText = '現在式';
                typeColorClass = 'text-blue-300';
            } else if (questionType === 'pastSimple') {
                typeText = '過去式';
                typeColorClass = 'text-yellow-300';
            } else if (questionType === 'pastParticiple') {
                typeText = 'VPP';
                typeColorClass = 'text-green-300';
            } else {
                typeText = 'V-ing';
                typeColorClass = 'text-pink-300';
            }
            
            currentQuestion = {
                verb: randomVerb,
                type: questionType,
                answer: randomVerb[questionType]
            };
            
            let promptWord = '';
            if (questionType === 'infinitive') {
                promptWord = `${randomVerb.translation} (${randomVerb.pastSimple})`;
            } else {
                promptWord = `${randomVerb.infinitive} (${randomVerb.translation})`;
            }

            questionText.innerHTML = `
                <div class="text-xs md:text-sm uppercase tracking-widest opacity-70 mb-2">Quiz Time</div>
                <span class="text-4xl md:text-6xl font-black block mb-4 filter drop-shadow-lg">${promptWord}</span>
                <div class="text-lg md:text-xl font-medium opacity-90">
                    請輸入 <span class="${typeColorClass} font-bold underline decoration-wavy underline-offset-4">${typeText}</span>
                </div>
            `;
            
            speak(currentQuestion.answer.replace('/', ' or '));
            
            // 重置輸入框樣式
            answerInput.className = "w-full text-center text-xl md:text-3xl font-bold py-4 px-4 md:py-5 md:px-6 rounded-2xl border-4 border-slate-200 focus:border-purple-400 focus:ring-4 focus:ring-purple-100 outline-none transition-all placeholder:text-slate-300 bg-white shadow-inner text-slate-700";
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();
            answerInput.parentElement.classList.remove('opacity-50'); 
            
            submitBtn.classList.remove('hidden-section');
            nextActionContainer.classList.add('hidden-section');
            
            // 重置回饋區塊
            feedbackContainer.innerHTML = '';
            feedbackContainer.className = 'mt-6 w-full transition-all opacity-0';
            
            isQuestionAnswered = false;
        }

        function checkAnswer() {
            if (!currentQuestion) return;

            const userAnswer = answerInput.value.trim().toLowerCase();
            const correctAnswer = currentQuestion.answer.toLowerCase();

            feedbackContainer.classList.remove('opacity-0');

            if (userAnswer === '') {
                feedbackContainer.innerHTML = '<div class="text-amber-500 animate-pulse font-bold text-xl md:text-2xl text-center w-full">⚡ 請輸入答案！</div>';
                return;
            }

            const answerSpeech = currentQuestion.answer.replace('/', ' or ');

            // 移除輸入框預設樣式
            answerInput.classList.remove('border-slate-200', 'bg-white', 'text-slate-700', 'focus:border-purple-400', 'focus:ring-purple-100');

            if (userAnswer === correctAnswer) {
                // 答對：輸入框變綠色，顯示巨大提示卡
                answerInput.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                
                feedbackContainer.innerHTML = `
                    <div class="w-full bg-emerald-100 border-4 border-emerald-400 text-emerald-800 px-4 py-4 md:py-6 rounded-2xl shadow-lg bounce-in flex flex-col md:flex-row items-center justify-center gap-3 md:gap-6">
                        <span class="text-5xl md:text-6xl drop-shadow-md">🎉</span> 
                        <div class="text-center md:text-left">
                            <div class="text-sm md:text-lg font-black opacity-70 uppercase tracking-widest mb-1">答對了！</div>
                            <div class="text-3xl md:text-5xl font-black">${currentQuestion.answer}</div>
                        </div>
                    </div>`;
                score += 10;
                streak++;
                playSound('correct');  // 播放成功音效
                speak(answerSpeech);   // 只唸出單字
            } else {
                // 答錯：輸入框變紅色並震動，顯示巨大提示卡
                answerInput.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-700', 'shake');
                
                feedbackContainer.innerHTML = `
                    <div class="w-full bg-rose-100 border-4 border-rose-400 text-rose-800 px-4 py-4 md:py-6 rounded-2xl shadow-lg bounce-in flex flex-col md:flex-row items-center justify-center gap-3 md:gap-6">
                        <span class="text-5xl md:text-6xl drop-shadow-md">💥</span>
                        <div class="text-center md:text-left">
                            <div class="text-sm md:text-lg font-black opacity-70 uppercase tracking-widest mb-1">答錯了，正解為：</div>
                            <div class="text-3xl md:text-5xl font-black">${currentQuestion.answer}</div>
                        </div>
                    </div>`;
                streak = 0;
                playSound('wrong');   // 播放失敗音效
                speak(answerSpeech);  // 只唸出單字
            }
            
            updateScoreboard();
            
            answerInput.disabled = true;
            
            submitBtn.classList.add('hidden-section');
            nextActionContainer.classList.remove('hidden-section');
            setTimeout(() => nextQuestionBtn.focus(), 50);
            
            isQuestionAnswered = true;
        }

        function switchTab(mode) {
            if (mode === 'study') {
                studyView.classList.remove('hidden-section');
                quizView.classList.add('hidden-section');
                
                tabStudy.classList.remove('text-slate-500', 'hover:bg-slate-100');
                tabStudy.classList.add('bg-gradient-to-r', 'from-violet-500', 'to-fuchsia-500', 'text-white', 'shadow-md', 'scale-100', 'md:scale-105');
                
                tabQuiz.classList.remove('bg-gradient-to-r', 'from-violet-500', 'to-fuchsia-500', 'text-white', 'shadow-md', 'scale-100', 'md:scale-105');
                tabQuiz.classList.add('text-slate-500', 'hover:bg-slate-100');
            } else {
                studyView.classList.add('hidden-section');
                quizView.classList.remove('hidden-section');
                
                tabQuiz.classList.remove('text-slate-500', 'hover:bg-slate-100');
                tabQuiz.classList.add('bg-gradient-to-r', 'from-violet-500', 'to-fuchsia-500', 'text-white', 'shadow-md', 'scale-100', 'md:scale-105');
                
                tabStudy.classList.remove('bg-gradient-to-r', 'from-violet-500', 'to-fuchsia-500', 'text-white', 'shadow-md', 'scale-100', 'md:scale-105');
                tabStudy.classList.add('text-slate-500', 'hover:bg-slate-100');
            }
        }

        tabStudy.addEventListener('click', () => switchTab('study'));
        tabQuiz.addEventListener('click', () => switchTab('quiz'));
        
        startGameBtn.addEventListener('click', startGame);
        backToLobbyBtn.addEventListener('click', returnToLobby);
        nextQuestionBtn.addEventListener('click', generateQuestion);
        submitBtn.addEventListener('click', checkAnswer);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !quizView.classList.contains('hidden-section') && !quizInterface.classList.contains('hidden-section')) {
                if (isQuestionAnswered) {
                    generateQuestion();
                } else {
                    checkAnswer();
                }
            }
        });
        
        document.body.addEventListener('click', () => {
             if (speechSynthesis.getVoices().length === 0) loadVoices();
             initAudio(); // 初始化音效引擎
        }, { once: true });

        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        renderTables();
        renderCategorySelector();
        updateScoreboard();
        
        switchTab('study');
    </script>
</body>
</html>
